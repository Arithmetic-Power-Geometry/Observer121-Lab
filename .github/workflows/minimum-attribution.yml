name: Observer121 minimum attribution kill test
on: [push, pull_request, workflow_dispatch]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python src/minimum_attribution_kill_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: observer121-minimum-attribution-kill-test
          path: artifacts/attribution-minimum/
