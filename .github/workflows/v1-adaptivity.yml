name: Observer121 V1 matched-language adaptivity
on: [push, pull_request, workflow_dispatch]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python src/v1_adaptivity_matched_language.py
      - uses: actions/upload-artifact@v4
        with:
          name: observer121-v1-matched-language-adaptivity
          path: artifacts/v1-adaptivity/
