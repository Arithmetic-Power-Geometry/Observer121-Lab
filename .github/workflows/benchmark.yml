name: Observer121 benchmark

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run benchmark
        run: python src/run_benchmark.py
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: observer121-benchmark-artifacts
          path: artifacts/
          if-no-files-found: error
