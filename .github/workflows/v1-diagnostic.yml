name: Observer121 V1 five-way diagnostic
on: [push, pull_request, workflow_dispatch]
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python src/v1_five_way_diagnostic.py
      - uses: actions/upload-artifact@v4
        with:
          name: observer121-v1-five-way-diagnostic
          path: artifacts/v1-diagnostic/
