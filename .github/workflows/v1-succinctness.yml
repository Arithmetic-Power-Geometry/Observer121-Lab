name: Observer121 V1 succinctness attack
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python src/v1_succinctness_attack.py
      - uses: actions/upload-artifact@v4
        with:
          name: observer121-v1-succinctness-attack
          path: artifacts/v1-succinctness/
