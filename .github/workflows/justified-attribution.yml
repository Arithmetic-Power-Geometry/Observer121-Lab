name: Observer121 justified attribution audit
on: [push, pull_request, workflow_dispatch]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python src/justified_attribution_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: observer121-justified-attribution
          path: artifacts/justified-attribution/
